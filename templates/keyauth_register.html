{% include 'keyauth_header.html' %}

<div class="auth-wrapper">
  <div class="auth-card animated-border">

    <div class="auth-header">
      <img src="/img/logo.png" alt="Krishu X Auth" style="width: 58px; height: 58px; object-fit: contain; margin-bottom: 12px; filter: drop-shadow(0 0 16px #ff2a5f);" onerror="this.src='/img/circle_logopng.png'">
      <div class="auth-badge" style="background: rgba(255,42,95,0.12); color: #ff7597; border-color: rgba(255,42,95,0.3);"><i class="fa-solid fa-user-plus"></i> NEW ACCOUNT</div>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join Krishu X Auth to manage your tools &amp; licenses</p>
    </div>

    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label">Username</label>
        <div class="input-wrap">
          <i class="fa-solid fa-user input-icon"></i>
          <input id="regUsername" class="form-input" placeholder="Choose a username" required minlength="3" autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email <span style="color: var(--text-3); font-weight: 400; text-transform: none; letter-spacing: 0;">(optional)</span></label>
        <div class="input-wrap">
          <i class="fa-solid fa-envelope input-icon"></i>
          <input id="regEmail" type="email" class="form-input" placeholder="name@domain.com" autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock input-icon"></i>
          <input id="regPassword" type="password" class="form-input" placeholder="Min. 6 characters" required minlength="6" autocomplete="new-password">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-shield-halved input-icon"></i>
          <input id="regConfirmPassword" type="password" class="form-input" placeholder="Re-enter password" required minlength="6" autocomplete="new-password">
        </div>
      </div>

      <button type="submit" id="regSubmitBtn" class="btn btn-primary btn-full" style="margin-top: 0.8rem;">
        <i class="fa-solid fa-user-check"></i> Create Account
      </button>
    </form>

    <div class="form-footer" style="margin-top: 1.25rem; text-align: center;">
      Already have an account? <a href="/keyauth/login" style="color: var(--cyan); font-weight: 700; text-decoration: none;">Sign in here</a>
    </div>
  </div>
</div>

<script>
  if (localStorage.getItem('token')) location.href = '/keyauth/dashboard';

  async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('regSubmitBtn');
    const orig = btn.innerHTML;

    const username = document.getElementById('regUsername').value.trim();
    const email    = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirm  = document.getElementById('regConfirmPassword').value;

    if (password !== confirm) return showToast('Passwords do not match', 'error');

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Creating account...';

    try {
      const res = await fetch('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      let data = {};
      try { data = await res.json(); } catch(e) { data = { message: 'Server communication failed' }; }

      if (res.ok && data.success) {
        showToast('🌸 Account created successfully! Launching Console...', 'success');
        if (data.token) {
          localStorage.setItem('adminToken', data.token);
          localStorage.setItem('adminUser', data.user.username);
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          setTimeout(() => location.href = '/admin/dashboard', 700);
        } else {
          setTimeout(() => location.href = '/keyauth/login', 900);
        }
      } else {
        showToast(data.message || 'Registration failed', 'error');
        btn.disabled = false;
        btn.innerHTML = orig;
      }
    } catch(err) {
      showToast(err.message || 'Cannot reach server', 'error');
      btn.disabled = false;
      btn.innerHTML = orig;
    }
  }
</script>

{% include 'keyauth_footer.html' %}
